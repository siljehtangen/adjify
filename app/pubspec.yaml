name: adjify
description: Multiplayer adjective storytelling game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Supabase
  supabase_flutter: ^2.5.6
  # Navigation
  go_router: ^14.2.0
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Networking / realtime
  socket_io_client: ^2.0.3+1
  http: ^1.2.1
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  font_awesome_flutter: ^10.7.0
  toastification: ^2.1.0
  # Utils
  envied: ^1.0.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  envied_generator: ^1.1.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - .env
